server {
    listen 443 ssl;
    http2 on;
    server_name gsk-poc.terminiai.com;

    ssl_certificate /etc/letsencrypt/live/ssl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssl/privkey.pem;

    root /dist; # Set root lib

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;  # 去掉 /api 前缀
        client_max_body_size 64m;
        proxy_http_version 1.1;
        proxy_pass http://host.docker.internal:8000; 
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Accept-Encoding gzip;
        proxy_read_timeout 1200s; 
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
    gzip_min_length 1024;

    # Home page
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        if ($request_filename ~* .*\.(?:htm|html)$)
            {
                add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate";
            }
    }

    # js and css
    location ~* \.(js|css)$ {
        expires 1w; # expired time
        access_log off; # reduce log size
    }

    # images
    location ~* \.(png|jpg|jpeg|gif|ico)$ {
        expires 1m;
        access_log off;
    }

}
